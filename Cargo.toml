[package]
name = "oxideav-basic"
version = "0.0.10"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-basic"
authors = ["Mark Karpeles"]
description = "Simple standard codecs and containers for oxideav (PCM, WAV, ...)"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-basic"
keywords = ["multimedia", "audio", "wav", "pcm", "pure-rust"]
categories = ["multimedia::encoding"]

[dependencies]
oxideav-core = "0.1"

# Dependency-free micro-benchmark (`harness = false` → a plain `main`
# timing loop on stable, no external bench-harness crate).
[[bench]]
name = "wav_roundtrip"
harness = false
