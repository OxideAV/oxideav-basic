[package]
name = "oxideav-basic"
version = "0.0.6"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/OxideAV/oxideav-basic"
authors = ["Mark Karpeles"]
description = "Simple standard codecs and containers for oxideav (PCM, WAV, ...)"

readme = "README.md"
homepage = "https://github.com/OxideAV/oxideav-basic"
keywords = ["multimedia", "audio", "wav", "pcm", "pure-rust"]
categories = ["multimedia::encoding"]

[dependencies]
oxideav-core = "0.1"
# Distributed-slice auto-registration into `oxideav_core::REGISTRARS`
# via the `oxideav_core::register!` macro. Tiny crate, no transitive
# deps; works on every target including wasm.
linkme = "0.3"
